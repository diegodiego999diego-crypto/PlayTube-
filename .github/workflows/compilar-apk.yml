name: Build PlayTube APK (Release)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar gradlew automáticamente
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew no existe, generándolo ahora..."
            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi

      - name: Compilar APK Release
        run: ./gradlew assembleRelease --stacktrace

      # 1. Instalar p7zip y empaquetar el APK con compresión ULTRA
      - name: Comprimir APK con compresión máxima (.7z)
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          mkdir -p paquete_ligero
          
          # Renombrar APK
          cp app/build/outputs/apk/release/*.apk ./PlayTube.apk
          
          # Compresión Ultra LZMA2 (-mx=9)
          7z a -t7z -mx=9 paquete_ligero/PlayTube-UltraComprimido.7z PlayTube.apk

      # 2. Subir el paquete aplicando también compresión máxima al artefacto
      - name: Subir APK Ultra Comprimido
        uses: actions/upload-artifact@v4
        with:
          name: PlayTube-Release-Minimo
          path: paquete_ligero/PlayTube-UltraComprimido.7z
          compression-level: 9