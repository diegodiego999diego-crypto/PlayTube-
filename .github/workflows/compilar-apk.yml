name: Build PlayTube APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Instala Gradle en la nube de GitHub
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Si NO existe gradlew en tu repo, este paso lo fabrica al instante
      - name: Generar gradlew automáticamente
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew no existe, generándolo ahora mismo..."
            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi

      # Compilar la aplicación
      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      # Guardar el APK descargable
      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: PlayTube-Debug
          path: app/build/outputs/apk/debug/*.apk